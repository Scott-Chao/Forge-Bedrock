[project]
name = "forge-bedrock"
description = "From-scratch implementations of AI fundamentals"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".claude"]
src = ["core"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"apps/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
